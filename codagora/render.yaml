services:
  - type: web
    name: codagora-api
    runtime: python
    region: singapore
    plan: free

    rootDir: backend

    buildCommand: ./build.sh

    startCommand: >
      python -m gunicorn
      config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-1}
      --timeout 60
      --access-logfile -
      --error-logfile -

    autoDeployTrigger: checksPass

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "true"

      - key: DJANGO_HSTS_SECONDS
        value: "3600"

      - key: DJANGO_HSTS_INCLUDE_SUBDOMAINS
        value: "false"

      - key: DJANGO_HSTS_PRELOAD
        value: "false"

      - key: DJANGO_LOG_LEVEL
        value: INFO

      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: ""

      - key: DJANGO_CORS_ALLOW_CREDENTIALS
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: codagora-production-db
          property: connectionString

      - key: POSTGRES_SSLMODE
        value: require

      - key: POSTGRES_CONN_MAX_AGE
        value: "60"

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json

      - key: CODAGORA_TERMS_VERSION
        value: "1.0"

      - key: CODAGORA_PRIVACY_VERSION
        value: "1.0"

      - key: CODAGORA_RECENT_AUTH_SECONDS
        value: "300"

      - key: CODAGORA_ACCOUNT_DELETION_GRACE_DAYS
        value: "7"

      - key: CODAGORA_TOKEN_ENCRYPTION_KEY
        sync: false

      - key: WORKSPACE_FILE_MAX_UPLOAD_SIZE_BYTES
        value: "52428800"

      - key: WORKSPACE_FILE_TRASH_RETENTION_DAYS
        value: "30"

      - key: LOCATION_SHARE_DEFAULT_DURATION_MINUTES
        value: "240"

      - key: LOCATION_SHARE_MAX_DURATION_MINUTES
        value: "1440"

      - key: LOCATION_SHARE_HISTORY_RETENTION_DAYS
        value: "7"

      - key: GITHUB_APP_CLIENT_ID
        sync: false

      - key: GITHUB_APP_CLIENT_SECRET
        sync: false

      - key: GITHUB_APP_SLUG
        value: codagora-connect

      - key: GITHUB_APP_PRIVATE_KEY_PATH
        value: /etc/secrets/github-app-private-key.pem

      - key: GITHUB_APP_MOBILE_REDIRECT_URL
        value: codagora://github/complete

      - key: GITHUB_API_VERSION
        value: "2026-03-10"

      - key: GITHUB_OAUTH_STATE_MINUTES
        value: "10"

      - key: OBJECT_STORAGE_BUCKET
        sync: false

      - key: OBJECT_STORAGE_REGION
        sync: false

      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false

      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false

      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false

      - key: WORKSPACE_FILE_DOWNLOAD_URL_TTL_SECONDS
        value: "300"


databases:
  - name: codagora-production-db
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    databaseName: codagora
    user: codagora